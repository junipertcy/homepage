<!--<mat-progress-bar mode="determinate" value="40"></mat-progress-bar>-->
@if (isLoaded) {
  <nz-layout class="layout">
    <nz-header>
      <a routerLink="/">
        <h1 id="logo-title">Tzu-Chi Yen</h1>
      </a>
        <button type="button" class="menu-trigger" aria-controls="primary-navigation" [attr.aria-expanded]="menuOpen()" (click)="menuOpen.set(!menuOpen())" (keydown.escape)="closeMenu($event)">Menu <span aria-hidden="true">{{ menuOpen() ? '▴' : '▾' }}</span></button>
        <div class="header-actions"><ng-container [ngTemplateOutlet]="utilities" [ngTemplateOutletContext]="{ $implicit: false }"></ng-container></div>
      <ng-template #utilities let-compact>
        <a class="cv-link" href="{{ cv_file }}" target="_blank" style="color: #fa541c">
          <nz-tag class="tag vitae" [nzColor]="'volcano'">Full CV</nz-tag>
        </a>
        <button type="button" class="dark-mode-button" [attr.aria-label]="compact ? null : 'Toggle dark mode'" [attr.aria-pressed]="isDarkMode" (click)="toggleDarkMode()">
          <app-icon [name]="isDarkMode ? 'brightness_7' : 'nights_stay'"></app-icon>
          @if (compact) { <span>Dark mode: {{ isDarkMode ? 'On' : 'Off' }}</span> }
        </button>
      </ng-template>
    </nz-header>
  <div class="layout-body">
    <nav id="primary-navigation" class="primary-nav" aria-label="Primary navigation" [class.open]="menuOpen()" (keydown.escape)="closeMenu($event)">
      <a class="menu-item" routerLink="/publications" routerLinkActive="ant-menu-item-selected" ariaCurrentWhenActive="page" (click)="selectPrimary($event, '/publications')">
        <span class="menu-label">Publications</span>
      </a>
      <a class="menu-item" routerLink="/talks" routerLinkActive="ant-menu-item-selected" ariaCurrentWhenActive="page" (click)="selectPrimary($event, '/talks')">
        <span class="menu-label">Talks</span>
      </a>
      <a class="menu-item" routerLink="/teaching" routerLinkActive="ant-menu-item-selected" [attr.aria-current]="url().startsWith('/teaching') ? 'location' : null" (click)="selectPrimary($event, '/teaching')">
        <span class="menu-label">Teaching</span>
      </a>
      <a class="menu-item" routerLink="/activities" routerLinkActive="ant-menu-item-selected" [attr.aria-current]="url().startsWith('/activities') ? 'location' : null" (click)="selectPrimary($event, '/activities')">
        <span class="menu-label">Activities</span>
      </a>
      <a class="menu-item" routerLink="/about" routerLinkActive="ant-menu-item-selected" ariaCurrentWhenActive="page" (click)="selectPrimary($event, '/about')">
        <span class="menu-label">About</span>
      </a>
    </nav>
    @if (menuOpen()) {
      <div class="compact-utilities" (keydown.escape)="closeMenu($event)"><ng-container [ngTemplateOutlet]="utilities" [ngTemplateOutletContext]="{ $implicit: true }"></ng-container></div>
    }
    <main #contentStart class="layout-content" tabindex="-1">
      <router-outlet></router-outlet>
    </main>
  </div>
  <div>
    <nz-footer id="footer">
      © Since 2016 Tzu-Chi Yen | Last update: {{ lastUpdateDate() }} |
      @if (lastUpdateDate() === undefined) {<span class="date-reserve"></span>}
      <a
        href="https://github.com/junipertcy/homepage"
        target="_blank"
        style="color: rgba(0, 0, 0, 0.65)"
        aria-label="Site source on GitHub"
        >
        <i nz-icon nzType="code" nzTheme="outline"></i>
      </a>
      | Powered by
      <a
        href="https://angular.io/"
        target="_blank"
        style="color: rgba(0, 0, 0, 0.65)"
        >
        Angular
      </a>
      and
      <a
        href="https://ng.ant.design/"
        target="_blank"
        style="color: rgba(0, 0, 0, 0.65)"
        >
        NG-ZORRO
      </a>
      &nbsp;
      <a routerLink="/textbooks" aria-label="Textbooks">🥾</a>
      &nbsp;
      <a routerLink="/reading" aria-label="Reading">🧢</a>
      &nbsp;
      <a routerLink="/books" aria-label="Books">📚</a>
      &nbsp;
      <a routerLink="/notion" aria-label="Notion">🎰</a>
      &nbsp;
    </nz-footer>
  </div>
</nz-layout>
}
