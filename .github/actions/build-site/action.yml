name: Build the site
description: >-
  Install dependencies, stub the licensed fonts and run the production build into
  dist/browser. Shared by the build and links workflows; run actions/checkout first.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 26
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

    # The Equity and Concourse fonts are commercially licensed and deliberately
    # gitignored, but src/styles/font-face.css has 36 url() references to them and
    # Angular's css-resource plugin fails the build on any it cannot resolve. Stub
    # them so the build can run. This gate checks that the app COMPILES — it says
    # nothing about how text renders, and the stubs never leave the runner.
    - name: Stub licensed fonts
      shell: bash
      run: |
        mkdir -p src/styles/fonts
        grep -ohE "url\('fonts/[^']+\.woff2'\)" src/styles/font-face.css \
          | sed -E "s|url\('fonts/||; s|'\)||" \
          | sort -u \
          | while read -r font; do : > "src/styles/fonts/$font"; done

    - run: pnpm build
      shell: bash
