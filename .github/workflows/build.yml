name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # LFS objects (PDFs, images) are copied as assets, never compiled, so the
          # pointer files are enough to produce a bundle.
          lfs: false

      # pnpm install, the licensed-font stubs and pnpm build; shared with links.yml.
      - uses: ./.github/actions/build-site

      # Every on-site link and file the built pages reference is in the build, and no page
      # links to a hijacked domain. Offline, no dependencies: scripts/links/check-built.mjs.
      - name: Check built links
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/links/check-built.mjs
